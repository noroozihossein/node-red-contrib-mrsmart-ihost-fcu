<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mr Smart FCU</title><link rel="stylesheet" href="/mrsmart-fcu-assets/style.css"><style>
/* Mr Smart FCU compact card — LinkPlay-aligned outer frame + branding only. */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:transparent!important}
body.cast{padding:8px!important;background:transparent!important}
.app{width:100%!important;height:100%!important;max-width:none!important;margin:0!important;padding:0!important}
.compactTile{position:relative;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:center;width:100%;height:100%;min-height:118px;padding:0 14px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at top left,rgba(74,104,170,.20),transparent 42%),linear-gradient(135deg,#181c25,#101319);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ctBrand{position:absolute;right:14px;bottom:12px;font-size:8px;font-weight:700;letter-spacing:.6px;color:#737e8e;line-height:1;pointer-events:none;user-select:none}
.ctTemp{text-align:center}.ctTarget{font-size:34px;font-weight:900}.ctRoom{font-size:12px;color:#b9c6d8}.ctRun{font-size:10px;color:#62d9ff;font-weight:800;margin-top:4px}.ctControls{display:grid;gap:7px}.ctModes,.ctFans{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.ctControls button{min-height:32px;padding:5px;font-size:10px}.ctAdjust{display:flex;justify-content:center;gap:8px}.ctAdjust button{width:34px;min-height:30px}
</style></head><body class="cast"><div class="app"><div class="compactTile"><div class="ctTemp"><div id="setval" class="ctTarget">--°</div><div class="ctRoom">ROOM <span id="current">--°</span></div><div id="running" class="ctRun">--</div><div class="ctAdjust"><button id="minus">−</button><button id="plus">+</button></div></div><div class="ctControls"><div id="modes" class="ctModes"></div><div id="fans" class="ctFans"></div></div><div class="ctBrand">MR SMART</div></div><div id="powerCard" style="display:none"><button id="power"></button><span id="powerText"></span></div></div><script src="/mrsmart-fcu-assets/app.js"></script></body></html>
